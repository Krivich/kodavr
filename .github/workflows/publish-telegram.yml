name: publish-telegram

# After a successful deploy on main, mirror each newly published dump to the
# @kodavr_xyz Telegram channel. Best-effort: the mirror never fails CI.
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  mirror:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: mirror newly published dumps to Telegram
        run: node scripts/telegram-mirror.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
