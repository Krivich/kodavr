name: dump-manifest

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  card:
    # Same-repo PRs only: a fork PR gets a read-only token and cannot comment.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: changed files
        run: >
          git diff --name-only
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}" > changed.txt
      - name: post manifest card
        run: node scripts/pr-manifest-card.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_FILES_FILE: changed.txt
