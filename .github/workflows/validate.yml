name: validate

on:
  pull_request:
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'input/**'
      - 'docs/**'
      - 'static/**'
      - '.github/**'
      - 'config/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'input/**'
      - 'docs/**'
      - 'static/**'
      - '.github/**'
      - 'config/**'
      - 'tests/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/tooling/quality-gates/validate.mjs
      - run: npm test
      - run: npm run contract
      - run: npm run workflow-arrows:lint
