8212; the API method</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="411.9883" x="3595.0117" y="2911.3613">of the TARGET brick this arrow calls (the callee), N = order 1 to 17</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="359.5225" x="3595.0117" y="2928.9707">line 2 (plain text):    why the call happens (business intent)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="363.0566" x="3595.0117" y="2946.5801">solid = call &#183; dashed = return &#183; dashed to an actor = a push</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="349.7129" x="3595.0117" y="2964.1895">click a brick &#8594; its file &#183; click a call &#8594; the method's source</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="53.6963" x="3595.0117" y="2981.7988">drawers</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="324.0918" x="3652.5977" y="2981.7988">= first-party code dirs; the code drawers are covered</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="286.2959" x="3595.0117" y="2999.4082">file-by-file (scripts/lib, scripts, input/controllers)</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="86.3379" x="3595.0117" y="3017.0176">linted idioms</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="273.0205" x="3685.2393" y="3017.0176">(workflow-arrows-lint): a brick's stereotype =</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="344.7158" x="3595.0117" y="3034.627">its drawer; every numbered call links the callee method,</text><text fill="#000000" 